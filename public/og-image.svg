<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f1117" />

  <!-- decorative tile row -->
  <g font-family="Noto Sans, sans-serif" font-weight="700" text-anchor="middle">
    <rect x="120" y="120" width="90" height="90" rx="14" fill="#2e3350" />
    <text x="165" y="178" font-size="34" fill="#cbd5f5">2</text>

    <rect x="230" y="120" width="90" height="90" rx="14" fill="#5b3aa0" />
    <text x="275" y="178" font-size="34" fill="#ffffff">8</text>

    <rect x="120" y="230" width="90" height="90" rx="14" fill="#0891b2" />
    <text x="165" y="288" font-size="30" fill="#ffffff">128</text>

    <rect x="230" y="230" width="90" height="90" rx="14" fill="#34d399" />
    <text x="275" y="288" font-size="26" fill="#111827">1024</text>
  </g>

  <!-- main tile mark -->
  <rect x="380" y="115" width="300" height="300" rx="48" fill="#facc15" />
  <text
    x="530"
    y="300"
    font-family="Noto Sans, sans-serif"
    font-weight="700"
    font-size="100"
    fill="#111827"
    text-anchor="middle"
  >2048</text>

  <text
    x="120"
    y="480"
    font-family="Noto Sans, sans-serif"
    font-weight="700"
    font-size="56"
    fill="#f4f4f5"
  >Play 2048 Free in Your Browser</text>
  <text
    x="120"
    y="530"
    font-family="Noto Sans, sans-serif"
    font-weight="400"
    font-size="30"
    fill="#9ca3af"
  >Slide, merge, and chase the 2048 tile. No install, no signup.</text>
</svg>
