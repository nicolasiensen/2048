<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2048</title>
    <link rel="stylesheet" href="/src/style.css" />
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-FTD920GC5L"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-FTD920GC5L");
    </script>
  </head>
  <body>
    <div id="app">
      <div id="game">
        <header id="scoreboard">
          <div class="score-box">
            <span class="score-label">Score</span>
            <span id="score-value">0</span>
          </div>
          <div class="score-box">
            <span class="score-label">Best</span>
            <span id="best-score-value">0</span>
          </div>
          <button id="new-game-button" type="button">New Game</button>
        </header>
        <div id="board-wrap">
          <canvas id="game-canvas"></canvas>
          <div id="win-banner" hidden>
            <p>You Win!</p>
            <button id="keep-playing-button" type="button">Keep Going</button>
          </div>
          <div id="game-over-overlay" hidden>
            <p>Game Over!</p>
            <button id="game-over-new-game-button" type="button">New Game</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
